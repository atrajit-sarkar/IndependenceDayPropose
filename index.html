<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Independence Day Date Proposal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-glow"></div>
    <div class="container">
      <div class="card">
        <div class="flag" aria-label="Indian flag">
          <span class="stripe saffron"></span>
          <span class="stripe white">
            <span class="chakra"></span>
          </span>
          <span class="stripe green"></span>
        </div>

        <div class="content">
          <p class="tiny-tag">A little patriotic surprise</p>
          <p class="question" id="questionText">Want to go on a date with me?</p>

          <div class="name-block">
            <label for="nameInput" class="name-label">Your name</label>
            <input id="nameInput" type="text" placeholder="Enter your name" maxlength="50" />
          </div>

          <div class="option-box">
            <button class="btn yes-btn" id="yesBtn">Yes</button>
            <button class="btn no-btn" id="noBtn" type="button">No</button>
          </div>

          <p class="message" id="message">I hope the answer is yes ✨</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
